# ============================================================================
# 쿼리 라우팅 패턴 설정 v1.0
# ============================================================================
# 2025-12-23: 하드코딩 패턴 → YAML 외부화 (기술 부채 개선)
#
# 설계 원칙:
#   1. 모드별 패턴 분리 (COST, YEAR_SUMMARY, SEARCH, DOCUMENT, QA)
#   2. 우선순위 체인 명시적 설정
#   3. 충돌 해결 규칙 정의
#   4. 신뢰도(confidence) 기준 설정
#   5. YAML 핫리로드로 무중단 반영
#
# 패턴 문법:
#   - 표준 Python 정규식 사용
#   - 대소문자 무시: (?i) 접두어 사용
#   - 한글 경계는 필요시 lookahead/lookbehind 사용

schema_version: 1
last_updated: "2025-12-23"

# ============================================================================
# 우선순위 체인 (높은 순서대로)
# ============================================================================
# Chain of Responsibility 패턴으로 순서대로 검사
# 첫 번째 매칭되는 모드가 선택됨
priority_chain:
  - year_summary      # 연도별 다중 문서 요약 (최우선)
  - content_only      # 정밀 내용 검색 ("내용에 X 들어간 문서")
  - exists_intent     # 존재 확인 ("있어?", "있나요?")
  - cost_intent       # 비용 조회 ("총액은?", "얼마?")
  - qa_question       # 정보 질의 ("IP 알려줘")
  - summary_intent    # 요약/정리 ("요약해줘", "정리해줘")
  - document          # 문서 내용 요청
  - search            # 문서 검색
  - qa                # 질답 모드 (기본)

# ============================================================================
# 충돌 해결 규칙
# ============================================================================
# 여러 패턴이 동시에 매칭될 때 우선순위 결정
conflict_rules:
  # YEAR_SUMMARY vs COST: 비용 키워드가 있으면 COST 우선
  - patterns: [year_summary, cost_intent]
    winner: cost_intent
    condition: "has_cost_keyword"
    keywords: ["합계", "총액", "얼마", "비용", "금액"]
    description: "작년 소모품 합계 얼마 → COST (not YEAR_SUMMARY)"

  # YEAR_SUMMARY vs SEARCH: YEAR_SUMMARY 패턴이 더 구체적
  - patterns: [year_summary, search]
    winner: year_summary
    condition: "has_year_content_question"
    description: "2024년 문서들은 어떤 내용이야 → YEAR_SUMMARY"

# ============================================================================
# 모드별 패턴 정의
# ============================================================================
patterns:

  # --------------------------------------------------------------------------
  # COST 모드: 비용 조회 질의
  # --------------------------------------------------------------------------
  cost_intent:
    description: "비용/금액 조회 질의"
    confidence: 0.95
    rules:
      # Pattern 1: 비용 키워드 + 질문형
      - name: "cost_keyword_interrogative"
        pattern: "(?i)(합계|총액|총계|금액|비용|예산|단가|견적).*(얼마|알려줘|알려주세요|확인|인지|인가요)"
        priority: 100

      # Pattern 2: 짧은 질문형 ("얼마였지?")
      - name: "short_interrogative"
        pattern: "(?i)얼마였지|얼마였나요|얼마야|얼마인가요|얼마예요"
        priority: 80

      # Pattern 3: 비용 키워드 + 조사 + 물음표
      - name: "cost_with_particle"
        pattern: "(?i)(총액|금액|비용|합계|총계)(은|는)?\\s*\\?"
        priority: 90

      # Pattern 4: 문맥 + 비용 키워드
      - name: "context_cost"
        pattern: "(?i)(기안|작성|구매|소모품|장비).*\\s+(총액|합계|비용|금액)"
        priority: 85

      # Pattern 5: 연도/기간 + 비용 키워드
      - name: "year_cost"
        pattern: "(?i)(\\d{4}|올해|작년|금년|전년).*(총액|합계|비용|금액|예산)"
        priority: 95

      # Pattern 6: 복합 비용 표현
      - name: "compound_cost"
        pattern: "(?i)(비용|금액)\\s*(합계|총액|총계)"
        priority: 70

  # --------------------------------------------------------------------------
  # YEAR_SUMMARY 모드: 연도별 다중 문서 요약
  # --------------------------------------------------------------------------
  year_summary:
    description: "연도별 다중 문서 요약 (LLM 종합 답변 생성)"
    confidence: 0.95
    # 비용 키워드가 있으면 COST로 위임 (conflict_rules 참조)
    exclude_keywords: ["합계", "총액", "얼마", "비용", "금액"]
    rules:
      # Pattern 1: "2024년 문서 다 알려줘" (다/전부/전체 + 동사)
      - name: "year_docs_all"
        pattern: "(?i)(\\d{4})\\s*년?\\s*(문서|기안서|검토서)?들?\\s*(다|전부|전체|모두|모든).*(알려|요약|정리|보여|읽|뭐야|뭔가요|어때|어떻게|있어)"
        priority: 100

      # Pattern 2: "2025년 문서(들)은/는 어떤 내용이야?"
      - name: "year_docs_content"
        pattern: "(?i)(\\d{4})\\s*년?\\s*(문서|기안서|검토서)들?(은|는)\\s*.*(내용|뭐|어떤|무슨)"
        priority: 100

      # Pattern 3: "다/전부/전체 + 연도" 순서
      - name: "all_year_order"
        pattern: "(?i)(다|전부|전체|모두|모든)\\s*(문서|기안서|검토서)?.*(\\d{4})\\s*년?"
        priority: 90

      # Pattern 4: "올해/작년 문서들 다 알려줘"
      - name: "relative_year_docs"
        pattern: "(?i)(올해|작년|금년|전년도|이번\\s*해)\\s+(문서|기안서|검토서)들?\\s*(다|전부|전체|모두|모든)?.*(내용|뭐|어떤|무슨|요약|정리|알려)"
        priority: 95

      # Pattern 5: "2024년 문서 요약/정리/개요"
      - name: "year_docs_summary"
        pattern: "(?i)(\\d{4})\\s*년?\\s*(문서|기안서)?들?\\s*(요약|정리|개요)"
        priority: 85

  # --------------------------------------------------------------------------
  # SEARCH 모드: 문서 검색
  # --------------------------------------------------------------------------
  search:
    description: "문서 검색 (목록 반환)"
    confidence: 0.85
    rules:
      # "XX 관련 문서"
      - name: "related_docs"
        pattern: "(?i)관련\\s*(문서|파일|기안서)"
        priority: 80

      # "문서 찾아줘", "문서 검색"
      - name: "find_docs"
        pattern: "(?i)(문서|파일|기안서)\\s*(찾|검색)"
        priority: 85

      # "있어?", "있나요"
      - name: "exists_question"
        pattern: "(?i)(있어\\??|있나요|있는지)"
        priority: 70

      # "몇 개", "개수"
      - name: "count_question"
        pattern: "(?i)(몇\\s*개|개수|총|count)"
        priority: 75

      # "보여줘", "알려줘" (목록 의도)
      - name: "list_request"
        pattern: "(?i)(문서|파일|기안서)들?\\s*(보여|알려|줘)"
        priority: 65

  # --------------------------------------------------------------------------
  # DOCUMENT 모드: 문서 내용/요약
  # --------------------------------------------------------------------------
  document:
    description: "특정 문서 내용 조회/요약"
    confidence: 0.90
    rules:
      # 파일명 패턴 (.pdf, .docx 등)
      - name: "filename_pattern"
        pattern: "(?i)\\S+\\.(pdf|docx?|xlsx?|hwp|pptx?)"
        priority: 100

      # "이 문서", "해당 파일" + 내용 요청
      - name: "doc_reference_content"
        pattern: "(?i)(이|해당|그|이번)\\s*(문서|파일|기안서).*(내용|요약|정리|읽어)"
        priority: 90

  # --------------------------------------------------------------------------
  # QA 모드: 질답 (기본)
  # --------------------------------------------------------------------------
  qa:
    description: "일반 질문/답변 (RAG 파이프라인)"
    confidence: 0.80
    rules:
      # 질문형 패턴
      - name: "question_pattern"
        pattern: "(?i)(어떻게|왜|뭐야|뭔가요|무엇|언제|어디)"
        priority: 50

      # 정보 요청
      - name: "info_request"
        pattern: "(?i)(알려줘|설명해|말해줘)"
        priority: 45

# ============================================================================
# 신뢰도 임계값
# ============================================================================
confidence_thresholds:
  very_high: 0.98       # SEARCH_CONTENT_ONLY
  high: 0.95            # COST, DOCUMENT (존재 확인)
  medium_high: 0.90     # DOCUMENT, SEARCH
  medium: 0.85          # SEARCH
  low: 0.80             # QA (기본)
  default: 0.75         # 불확실한 경우

# ============================================================================
# 키워드 목록 (코드에서 참조)
# ============================================================================
keywords:
  # QA 의도 키워드
  qa_intent:
    - "알려줘"
    - "설명해"
    - "뭐야"
    - "뭔가요"
    - "어떻게"
    - "왜"
    - "무엇"
    - "언제"
    - "어디"

  # 비용 관련 키워드
  cost_related:
    - "합계"
    - "총액"
    - "금액"
    - "비용"
    - "예산"
    - "단가"
    - "견적"
    - "얼마"

  # 목록 의도 키워드
  list_intent:
    - "목록"
    - "리스트"
    - "전체"
    - "다"
    - "모두"
    - "모든"
